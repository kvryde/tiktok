<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Reels</title>
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#0d0a0c;--ink:#fff;--dim:#ffffffb3;--rose:#ff3b6b;--pane:#1b1418}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 30%,#3a1325,#0a0608 70%);display:grid;place-items:center;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
.phone{width:390px;height:800px;max-height:96vh;background:#000;border-radius:48px;border:10px solid #1c1c1f;box-shadow:0 0 0 2px #444,0 30px 80px #000;position:relative;overflow:hidden}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#000;border-radius:20px;z-index:30}
.screen{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:22px;padding:42px 0 10px;background:linear-gradient(#000a,transparent)}
.top button{background:none;border:0;font-weight:700;font-size:16px;color:var(--dim);padding:4px 2px;border-bottom:2px solid transparent}
.top button.on{color:#fff;border-color:#fff}
#feed{position:absolute;inset:0 0 58px 0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.v{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000}
.v video{width:100%;height:100%;object-fit:cover;display:block}
.rail{position:absolute;right:8px;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rail button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 1px 4px #000}
.rail i{font-style:normal;font-size:30px;line-height:1}
.rail b{font-size:12px}
.rail .liked i{color:var(--rose)}
.av{width:44px;height:44px;border-radius:50%;background:var(--rose);display:grid;place-items:center;font-weight:700;border:2px solid #fff}
.cap{position:absolute;left:12px;right:76px;bottom:76px;text-shadow:0 1px 4px #000}
.cap p{font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.ck{color:var(--rose)}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:var(--dim)}
nav{position:absolute;left:0;right:0;bottom:0;height:58px;background:#000;display:flex;align-items:center;justify-content:space-around;z-index:20;padding-bottom:4px}
nav button{background:none;border:0;font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px}
nav button.on{color:#fff}
nav .plus{width:46px;height:32px;border-radius:10px;border:0;background:linear-gradient(90deg,#25f4ee 0 12%,var(--rose) 88%);color:#fff;font-size:24px;font-weight:700;display:grid;place-items:center}
#prof{position:absolute;inset:0 0 58px 0;overflow-y:auto;padding:60px 14px 14px;text-align:center}
#prof h2{margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:14px}
.grid video{width:100%;aspect-ratio:3/4;object-fit:cover;background:#222}
.btn{background:var(--rose);border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn.alt{background:#2c2227}
.btn:disabled{opacity:.5}
.sheet{position:absolute;inset:0;z-index:40;background:#0009;display:flex;align-items:flex-end}
.sheet[hidden],#prof[hidden]{display:none}
.panel{background:var(--pane);width:100%;max-height:78%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px 22px}
.panel h3{margin-bottom:12px}
.panel input,.panel textarea{width:100%;background:#2c2227;border:1px solid #4a3a42;border-radius:10px;padding:11px;margin-bottom:10px}
.row{display:flex;gap:8px}
.c{padding:8px 0;border-bottom:1px solid #ffffff14;font-size:14px;overflow-wrap:anywhere}
.c b{color:var(--rose)}
.msg{color:#ffb3c4;font-size:13px;min-height:18px;margin-bottom:6px}
#inbox,#chat{position:absolute;inset:0 0 58px 0;background:var(--bg);z-index:22;overflow-y:auto;padding-top:46px}
#chat{inset:0;z-index:35;display:flex;flex-direction:column;padding-top:44px;overflow:hidden}
#inbox[hidden],#chat[hidden]{display:none}
.mh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #ffffff14}
.mh h2{flex:1}
.bk{background:none;border:0;font-size:30px;line-height:1}
.ch{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.ch p{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
#ml{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:76%;padding:9px 12px;border-radius:16px;overflow-wrap:anywhere;font-size:14px}
.b.me{align-self:flex-end;background:var(--rose)}
.b.th{align-self:flex-start;background:#2c2227}
.b img,.b video{width:100%;border-radius:10px;display:block;max-height:320px;object-fit:cover}
.b small{display:block;margin-top:4px;opacity:.85}
.mi{display:flex;gap:8px;padding:10px;border-top:1px solid #ffffff14;align-items:center;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.mi #ct{flex:1;min-width:0;background:#2c2227;border:1px solid #4a3a42;border-radius:20px;padding:10px 14px}
.mi #cp{background:none;border:0;font-size:24px}
.lt{position:absolute;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#5a1230,#12060b 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;overflow:hidden;animation:fi .6s}
.lt[hidden]{display:none}
@keyframes fi{from{opacity:0}}
.fh{position:absolute;bottom:-30px;color:#ff3b6b66;font-style:normal;font-size:22px;animation:fh 7s linear infinite}
@keyframes fh{to{transform:translateY(-110vh) rotate(25deg)}}
.env{position:relative;width:270px;height:180px;cursor:pointer;animation:bob 2.4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.lt.open .env{animation:none}
.eb{position:absolute;inset:0;background:#d9b99a;border-radius:6px}
.ef{position:absolute;inset:0;background:#f0dcc6;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:6px}
.fl{position:absolute;left:0;right:0;top:0;height:105px;background:#e6cdb2;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3}
.lt.open .fl{transform:rotateX(180deg);z-index:1}
.sl{position:absolute;left:50%;top:96px;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#c4183f;color:#ffd7e0;display:grid;place-items:center;font-size:22px;z-index:4;box-shadow:0 3px 8px #0008;transition:.5s}
.lt.open .sl{transform:scale(0);opacity:0}
.hint{color:#ffd7e0;font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:19px;min-height:26px}
.lt.read .env,.lt.read .hint{display:none}
.lp{position:absolute;inset:0;background:#fbf1e4;color:#4a2230;display:flex;flex-direction:column;justify-content:safe center;gap:22px;padding:70px 30px 40px;overflow-y:auto;animation:rise .9s ease-out;z-index:2}
.lp[hidden]{display:none}
@keyframes rise{from{transform:translateY(45%) scale(.55);opacity:0}}
.pt{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:22px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.sg{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;text-align:right;font-size:18px;color:#c4183f}
.lp .btn{align-self:center}
@media(max-width:480px){.phone{width:100vw;height:100dvh;max-height:none;border:0;border-radius:0}.notch{display:none}.top{padding-top:calc(env(safe-area-inset-top,0px) + 16px)}nav{height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}#feed,#prof{bottom:calc(58px + env(safe-area-inset-bottom,0px))}}
</style></head>
<body>
<div class="phone"><div class="notch"></div>
<div class="screen">
 <div class="top"><button data-t="fy" class="on">For You</button></div>
 <div id="feed"></div>
 <div id="prof" hidden></div>
 <nav><button data-n="home" class="on"><i>⌂</i>Home</button><button class="plus" data-n="add">+</button><button data-n="inbox"><i>✉</i>Inbox</button><button data-n="me"><i>☺</i>Profile</button></nav>
 <div id="lt" class="lt" hidden>
  <i class="fh" style="left:8%;animation-delay:0s">♥</i><i class="fh" style="left:28%;animation-delay:2s">♥</i><i class="fh" style="left:52%;animation-delay:4s">♥</i><i class="fh" style="left:74%;animation-delay:1s">♥</i><i class="fh" style="left:90%;animation-delay:3s">♥</i>
  <div class="env" id="env"><div class="eb"></div><div class="ef"></div><div class="fl"></div><div class="sl">♥</div></div>
  <p class="hint" id="hint">A letter for you… tap to open</p>
  <div class="lp" id="lp" hidden><div class="pt" id="ptx"></div><div class="sg" id="psg"></div><button class="btn" id="pcl">Close ♥</button></div>
 </div>
 <div id="inbox" hidden></div>
 <div id="chat" hidden></div>
 <div id="sheet" class="sheet" hidden><div class="panel" id="panel"></div></div>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,query,orderBy,limit,where,increment,serverTimestamp,writeBatch,onSnapshot,deleteDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== Firebase config (tiktok-for-her) ====== */
const firebaseConfig={
  apiKey:"AIzaSyC_hQBmRbEmAt7KyJwBqUsTiLZ4D3r22mI",
  authDomain:"tiktok-for-her.firebaseapp.com",
  projectId:"tiktok-for-her",
  storageBucket:"tiktok-for-her.firebasestorage.app",
  messagingSenderId:"861101771869",
  appId:"1:861101771869:web:4e6d9dc6c1f8acf25611b4"
};
/* ======================================================================== */

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NICE={'auth/email-already-in-use':'That name is taken. Try another.','auth/invalid-credential':'Wrong name or password.','auth/user-not-found':'Wrong name or password.','auth/wrong-password':'Wrong name or password.','auth/weak-password':'Password needs 6+ characters.','auth/too-many-requests':'Too many tries. Wait a bit and try again.'};
const nice=e=>NICE[e.code]||(e.code||e.message||'Something went wrong').replace('auth/','').replace(/-/g,' ');
const nameOk=n=>/^[A-Za-z0-9_]{3,20}$/.test(n);
const mail=n=>n.toLowerCase()+'@reels.local';
let me=null,myLikes=new Set(),tab='fy',vids=[],muted=true,busy=false;

const io=new IntersectionObserver(es=>es.forEach(e=>{
  const v=e.target.querySelector('video');
  if(e.intersectionRatio>.6){v.muted=muted;v.play().catch(()=>{})}else{v.pause();v.currentTime=0}
}),{threshold:[0,.6,1],root:$('#feed')});

async function loadMe(u){
  me=null;myLikes=new Set();
  if(!u)return;
  const s=await getDoc(doc(db,'users',u.uid));
  const d=s.exists()?s.data():{};
  me={uid:u.uid,username:d.username||'me',isAdmin:!!d.isAdmin};
  const l=await getDocs(collection(db,'users',u.uid,'likes'));
  l.forEach(x=>myLikes.add(x.id));
}
async function refresh(){await loadMe(auth.currentUser);loadFeed();if(!$('#prof').hidden)profile()}

async function loadFeed(){
  try{
    const s=await getDocs(query(collection(db,'videos'),orderBy('createdAt','desc'),limit(60)));
    vids=s.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){$('#feed').innerHTML=`<div class="empty">Could not load videos.<br>${esc(nice(e))}</div>`;return}
  if(tab==='fy')vids=[...vids.filter(v=>v.isAdmin),...vids.filter(v=>!v.isAdmin)];
  renderFeed();
}

function card(v){
  const u=v.username||'user';
  return `<section class="v" data-id="${esc(v.id)}"><video src="${esc(v.url)}" loop playsinline muted preload="metadata"></video>
  <div class="rail"><div class="av">${esc(u[0]).toUpperCase()}</div>
  <button class="${myLikes.has(v.id)?'liked':''}" data-a="like"><i>♥</i><b>${v.likeCount||0}</b></button>
  <button data-a="cm"><i>💬</i><b>${v.commentCount||0}</b></button>
  <button data-a="sh"><i>➤</i><b>Share</b></button>${me&&(me.uid===v.uid||me.isAdmin)?'<button data-a="del"><i>🗑</i><b>Delete</b></button>':''}</div>
  <div class="cap"><strong>@${esc(u)}${v.isAdmin?' <span class="ck">♥</span>':''}</strong><p>${esc(v.caption)}</p></div></section>`;
}
function renderFeed(){
  const f=$('#feed');
  f.innerHTML=vids.length?vids.map(card).join(''):'<div class="empty">No videos yet.<br>Tap + to post the first one.</div>';
  f.querySelectorAll('.v').forEach(s=>io.observe(s));
  f.scrollTop=0;
}

$('#feed').addEventListener('click',async e=>{
  const sec=e.target.closest('.v');if(!sec)return;
  const id=sec.dataset.id,a=e.target.closest('[data-a]')?.dataset.a;
  if(a==='like')return like(id,sec);
  if(a==='cm')return comments(id,sec);
  if(a==='del')return delVideo(id,sec);
  if(a==='sh')return shareSheet(vids.find(x=>x.id===id));
  const vd=sec.querySelector('video');
  if(muted){muted=false;document.querySelectorAll('video').forEach(x=>x.muted=false);return}
  vd.paused?vd.play():vd.pause();
});

async function like(id,sec){
  if(!me)return authSheet();
  const v=vids.find(x=>x.id===id),has=myLikes.has(id),lr=doc(db,'users',me.uid,'likes',id),vr=doc(db,'videos',id),b=writeBatch(db);
  if(has){b.delete(lr);b.update(vr,{likeCount:increment(-1)});myLikes.delete(id);v.likeCount=Math.max(0,(v.likeCount||0)-1)}
  else{b.set(lr,{at:serverTimestamp()});b.update(vr,{likeCount:increment(1)});myLikes.add(id);v.likeCount=(v.likeCount||0)+1}
  const btn=sec.querySelector('[data-a=like]');btn.classList.toggle('liked',!has);btn.querySelector('b').textContent=v.likeCount;
  try{await b.commit()}catch(e){console.error(e)}
}

function sheet(html){$('#panel').innerHTML=html;$('#sheet').hidden=false}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').hidden=true});

async function comments(id,sec){
  sheet('<h3>Comments</h3><div id="cl">Loading…</div>');
  const s=await getDocs(query(collection(db,'videos',id,'comments'),orderBy('createdAt')));
  const list=s.docs.map(d=>d.data());
  $('#cl').innerHTML=(list.length?list.map(c=>`<div class="c"><b>@${esc(c.username)}</b> ${esc(c.body)}</div>`).join(''):'<div class="c">No comments yet.</div>')
   +`<div class="row" style="margin-top:12px"><input id="ci" placeholder="Add a comment" maxlength="200" style="margin:0"><button class="btn" id="cs">Post</button></div>`;
  $('#cs').onclick=async()=>{
    const t=$('#ci').value.trim();if(!t)return;
    if(!me)return authSheet();
    const b=writeBatch(db);
    b.set(doc(collection(db,'videos',id,'comments')),{uid:me.uid,username:me.username,body:t,createdAt:serverTimestamp()});
    b.update(doc(db,'videos',id),{commentCount:increment(1)});
    await b.commit();
    const v=vids.find(x=>x.id===id);v.commentCount=(v.commentCount||0)+1;
    sec.querySelector('[data-a=cm] b').textContent=v.commentCount;
    comments(id,sec);
  };
}

function authSheet(){
  sheet(`<h3>Log in or sign up</h3><div class="msg" id="am"></div>
  <input id="au" placeholder="Username (letters, numbers, _)" maxlength="20" autocapitalize="none" autocomplete="username"><input id="ap" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <div class="row"><button class="btn" id="li" style="flex:1">Log in</button><button class="btn alt" id="su" style="flex:1">Sign up</button></div>`);
  const m=t=>$('#am').textContent=t;
  $('#li').onclick=async()=>{
    const n=$('#au').value.trim();if(!nameOk(n))return m('Enter your username.');
    try{await signInWithEmailAndPassword(auth,mail(n),$('#ap').value);$('#sheet').hidden=true}
    catch(e){m(nice(e))}
  };
  $('#su').onclick=async()=>{
    const username=$('#au').value.trim();if(!nameOk(username))return m('Username: 3-20 letters, numbers or _ only.');
    busy=true;
    try{
      const c=await createUserWithEmailAndPassword(auth,mail(username),$('#ap').value);
      await setDoc(doc(db,'users',c.user.uid),{username,isAdmin:false,createdAt:serverTimestamp()});
      busy=false;$('#sheet').hidden=true;await refresh();
    }catch(e){busy=false;m(nice(e))}
  };
}

function uploadSheet(){
  if(!me)return authSheet();
  sheet(`<h3>Post a video</h3><div class="msg" id="um"></div>
  <input id="uf" type="url" placeholder="Paste a direct video link (.mp4)" autocapitalize="none"><textarea id="uc" rows="2" maxlength="300" placeholder="Write a caption"></textarea>
  <button class="btn" id="ub" style="width:100%">Post video</button>`);
  $('#ub').onclick=async()=>{
    const url=$('#uf').value.trim(),m=t=>$('#um').textContent=t;
    if(!/^https:\/\/.+/i.test(url))return m('Paste a link that starts with https://');
    $('#ub').disabled=true;
    try{
      await addDoc(collection(db,'videos'),{uid:me.uid,username:me.username,isAdmin:me.isAdmin,url,caption:$('#uc').value.trim(),likeCount:0,commentCount:0,createdAt:serverTimestamp()});
      $('#sheet').hidden=true;go('home');
    }catch(e){$('#ub').disabled=false;m(nice(e))}
  };
}

async function profile(){
  const p=$('#prof');
  if(!me){p.innerHTML='<div class="empty" style="height:80%">Log in to see your profile.<br><br><button class="btn" id="pl">Log in</button></div>';$('#pl').onclick=authSheet;return}
  p.innerHTML=`<div class="av" style="width:72px;height:72px;font-size:28px;margin:0 auto">${esc(me.username[0]).toUpperCase()}</div><h2>@${esc(me.username)}</h2><button class="btn alt" id="lo">Log out</button>${me.isAdmin?' <button class="btn" id="ann">💌 Send love letter</button>':''}<div class="grid" id="pg"></div>`;
  $('#lo').onclick=async()=>{await signOut(auth);go('home')};
  if(me.isAdmin)$('#ann').onclick=annSheet;
  const s=await getDocs(query(collection(db,'videos'),where('uid','==',me.uid)));
  const mine=s.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  $('#pg').innerHTML=mine.map(v=>`<video src="${esc(v.url)}#t=0.1" preload="metadata" muted playsinline></video>`).join('');
}

/* ===== Messages ===== */
const cid=(a,b)=>[a,b].sort().join('_');
let unsubI=null,unsubC=null;
async function ensureChat(o){const id=cid(me.uid,o.uid);await setDoc(doc(db,'chats',id),{members:[me.uid,o.uid],names:{[me.uid]:me.username,[o.uid]:o.username}},{merge:true});return id}
async function sendMsg(id,d){
  await addDoc(collection(db,'chats',id,'messages'),{from:me.uid,...d,createdAt:serverTimestamp()});
  await setDoc(doc(db,'chats',id),{last:d.type==='image'?'📷 Photo':d.type==='video'?'🎬 Video':d.text,lastAt:serverTimestamp()},{merge:true});
}
async function pickUser(cb){
  if(!me)return authSheet();
  sheet('<h3>Send to…</h3><input id="pf" placeholder="Search names"><div id="pl2">Loading…</div>');
  const s=await getDocs(query(collection(db,'users'),limit(100)));
  const us=s.docs.filter(d=>d.id!==me.uid).map(d=>({uid:d.id,username:d.data().username||'user'}));
  const draw=()=>{
    const q=$('#pf').value.toLowerCase(),l=us.filter(u=>u.username.toLowerCase().includes(q));
    $('#pl2').innerHTML=l.length?l.map((u,i)=>`<div class="ch" data-i="${i}"><div class="av">${esc(u.username[0]).toUpperCase()}</div><b>@${esc(u.username)}</b></div>`).join(''):'<div class="c">No one found.</div>';
    $('#pl2').querySelectorAll('.ch').forEach(e=>e.onclick=()=>cb(l[+e.dataset.i]));
  };
  $('#pf').oninput=draw;draw();
}
function shareSheet(v){
  sheet('<h3>Share</h3><button class="btn" id="s1" style="width:100%;margin-bottom:8px">Send in a message</button><button class="btn alt" id="s2" style="width:100%">Copy link</button>');
  $('#s1').onclick=()=>pickUser(async o=>{
    const id=await ensureChat(o);
    await sendMsg(id,{type:'video',url:v.url,text:v.caption||'',by:v.username});
    sheet(`<h3>Sent to @${esc(o.username)}</h3><button class="btn" id="oc" style="width:100%">Open chat</button>`);
    $('#oc').onclick=()=>{go('inbox');openChat(o)};
  });
  $('#s2').onclick=async()=>{
    if(navigator.share){navigator.share({title:'Watch this',url:v.url}).catch(()=>{})}
    else await navigator.clipboard.writeText(v.url);
    $('#sheet').hidden=true;
  };
}
function showInbox(){
  if(!me){go('home');return authSheet()}
  const ib=$('#inbox');ib.hidden=false;
  ib.innerHTML='<div class="mh"><h2>Messages</h2><button class="btn" id="nm">New</button></div><div id="cl2"></div>';
  $('#nm').onclick=()=>pickUser(openChat);
  unsubI&&unsubI();
  unsubI=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),s=>{
    const rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.last).sort((a,b)=>(b.lastAt?.seconds||0)-(a.lastAt?.seconds||0));
    $('#cl2').innerHTML=rows.length?rows.map(r=>{const ou=r.members.find(x=>x!==me.uid),n=r.names?.[ou]||'user';
      return `<div class="ch" data-u="${esc(ou)}" data-un="${esc(n)}"><div class="av">${esc(n[0]).toUpperCase()}</div><div><b>@${esc(n)}</b><p>${esc(r.last)}</p></div></div>`}).join('')
      :'<div class="empty" style="height:60%">No chats yet.<br>Tap New to message someone.</div>';
    $('#cl2').querySelectorAll('.ch').forEach(e=>e.onclick=()=>openChat({uid:e.dataset.u,username:e.dataset.un}));
  });
}
const bubble=m=>{
  let b;
  if(m.type==='image')b=`<img src="${esc(m.url)}" loading="lazy">`;
  else if(m.type==='video')b=`<video src="${esc(m.url)}" controls playsinline preload="metadata"></video>${m.by?`<small>@${esc(m.by)}</small>`:''}${m.text?`<div>${esc(m.text)}</div>`:''}`;
  else b=esc(m.text);
  return `<div class="b ${m.from===me.uid?'me':'th'}">${b}</div>`;
};
async function openChat(o){
  $('#sheet').hidden=true;
  const id=await ensureChat(o),c=$('#chat');c.hidden=false;
  c.innerHTML=`<div class="mh"><button class="bk" id="cb">‹</button><div class="av" style="width:34px;height:34px">${esc(o.username[0]).toUpperCase()}</div><b>@${esc(o.username)}</b></div><div id="ml"></div><div class="mi"><input id="ct" placeholder="Message" maxlength="500"><button class="btn" id="cs2">Send</button></div>`;
  unsubC&&unsubC();
  unsubC=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('createdAt'),limit(200)),s=>{
    $('#ml').innerHTML=s.docs.map(d=>bubble(d.data())).join('');$('#ml').scrollTop=1e9;
  });
  $('#cb').onclick=()=>{unsubC&&unsubC();unsubC=null;c.hidden=true;c.innerHTML=''};
  const send=async()=>{const t=$('#ct').value.trim();if(!t)return;$('#ct').value='';await sendMsg(id,{type:'text',text:t})};
  $('#cs2').onclick=send;$('#ct').onkeydown=e=>{if(e.key==='Enter')send()};
}

/* ===== Delete video + love letter announcements ===== */
function delVideo(id,sec){
  sheet('<h3>Delete this video?</h3><div class="row"><button class="btn alt" id="dn" style="flex:1">Cancel</button><button class="btn" id="dy" style="flex:1">Delete</button></div>');
  $('#dn').onclick=()=>$('#sheet').hidden=true;
  $('#dy').onclick=async()=>{
    try{await deleteDoc(doc(db,'videos',id));$('#sheet').hidden=true;vids=vids.filter(v=>v.id!==id);sec.remove();if(!vids.length)renderFeed()}
    catch(e){$('#dy').textContent=nice(e)}
  };
}
function annSheet(){
  sheet('<h3>💌 Send a love letter</h3><div class="msg" id="gm">It pops up full-screen for everyone who has the app open.</div><textarea id="gt" rows="6" maxlength="600" placeholder="Write your letter…"></textarea><button class="btn" id="gs" style="width:100%">Send now</button>');
  $('#gs').onclick=async()=>{
    const t=$('#gt').value.trim();if(!t)return;
    $('#gs').disabled=true;
    try{await addDoc(collection(db,'announcements'),{text:t,from:me.uid,fromName:me.username,createdAt:serverTimestamp()});$('#sheet').hidden=true}
    catch(e){$('#gs').disabled=false;$('#gm').textContent=nice(e)}
  };
}
function showLetter(x){
  const lt=$('#lt');
  $('#ptx').textContent=x.text;$('#psg').textContent=x.fromName?'— @'+x.fromName+' ♥':'';
  lt.classList.remove('open','read');$('#lp').hidden=true;$('#hint').textContent='A letter for you… tap to open';lt.hidden=false;
  $('#env').onclick=()=>{
    if(lt.classList.contains('open'))return;
    lt.classList.add('open');$('#hint').textContent='';
    setTimeout(()=>{$('#lp').hidden=false;lt.classList.add('read')},1300);
  };
  $('#pcl').onclick=()=>{lt.hidden=true;try{localStorage.setItem('seenLetter',x.id)}catch(e){}};
}
function listenLetters(){
  onSnapshot(query(collection(db,'announcements'),orderBy('createdAt','desc'),limit(1)),s=>{
    const d=s.docs[0];if(!d)return;
    const x={id:d.id,...d.data()};
    if(!x.createdAt||Date.now()/1000-x.createdAt.seconds>7*86400)return;
    let seen='';try{seen=localStorage.getItem('seenLetter')||''}catch(e){}
    if(seen!==x.id)showLetter(x);
  },()=>{});
}

function go(n){
  document.querySelectorAll('nav [data-n]').forEach(b=>b.classList.toggle('on',b.dataset.n===n));
  const off=n==='me'||n==='inbox';
  $('#prof').hidden=n!=='me';$('#inbox').hidden=n!=='inbox';$('#chat').hidden=true;$('#feed').style.visibility=off?'hidden':'visible';
  document.querySelector('.top').style.display=off?'none':'flex';
  if(n!=='inbox'&&unsubI){unsubI();unsubI=null}
  if(unsubC){unsubC();unsubC=null}
  if(off)document.querySelectorAll('video').forEach(v=>v.pause());
  if(n==='me')profile();else if(n==='inbox')showInbox();else loadFeed();
}
document.querySelectorAll('nav [data-n]').forEach(b=>b.onclick=()=>b.dataset.n==='add'?uploadSheet():go(b.dataset.n));
document.querySelectorAll('.top [data-t]').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll('.top [data-t]').forEach(x=>x.classList.toggle('on',x===b));loadFeed();
});
onAuthStateChanged(auth,async()=>{if(!busy)await refresh()});
listenLetters();
</script>
</body></html>
